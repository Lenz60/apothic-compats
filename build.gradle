plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    exclude('.cache/**')
    manifest {
        attributes(["MixinConfigs": "${mod_id}.mixins.json",
                    'Specification-Title': mod_id,
                    'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    'Implementation-Title': mod_name,
                    'Implementation-Version': mod_version,
                    'Implementation-Vendor': mod_authors])
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url 'https://maven.blamejared.com/'
    }
    maven {
        url 'https://maven.shadowsoffire.dev/releases'
        content { includeGroup 'dev.shadowsoffire' }
    }
    maven {
        url 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:$minecraft_version-$forge_version"

    implementation fg.deobf("dev.shadowsoffire:Apotheosis:$minecraft_version-$apotheosis_version")
    implementation fg.deobf("dev.shadowsoffire:Placebo:$minecraft_version-$placebo_version")
    implementation fg.deobf("dev.shadowsoffire:ApothicAttributes:$minecraft_version-$attributeslib_version")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:$curios_version")

    // compat compile deps
    implementation fg.deobf("curse.maven:the-aether-255308:$aether_version")
    implementation fg.deobf("curse.maven:malum-484064:$malum_version")
    implementation fg.deobf("curse.maven:create-328085:$create_version")
    implementation fg.deobf("maven.modrinth:irons-artifice:$artifice_version")

    // runtime helpers for local testing
    implementation fg.deobf("maven.modrinth:moonlight:$moonlight_version")
    implementation fg.deobf("maven.modrinth:lodestonelib:$lodestone_version")

    implementation fg.deobf("curse.maven:supplementaries-412082:$supplementaries_version")
    implementation fg.deobf("curse.maven:amendments-896746:$amendments_version")
    runtimeOnly "maven.modrinth:ancient-reforging:$ancientreforging_version"
}

minecraft {
    mappings channel: 'parchment', version: "$parchment_mappings_version-$parchment_minecraft_version"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            
        }

        server {
            
            args '--nogui'
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://$project.projectDir/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
