plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    exclude('.cache/**')
    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixins.json,${mod_id}.l2hostility.mixins.json",
                    'Specification-Title': mod_id,
                    'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    'Implementation-Title': mod_name,
                    'Implementation-Version': mod_version,
                    'Implementation-Vendor': mod_authors])
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url 'https://maven.blamejared.com/'
    }
    maven {
        url 'https://maven.shadowsoffire.dev/releases'
        content { includeGroup 'dev.shadowsoffire' }
    }
    maven {
        url 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven { url 'https://maven.theillusivec4.top' }
    maven { url 'https://maven.shadowsoffire.dev/releases' }
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://maven.k-4u.nl' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://rtxyd.github.io/maven-repo' }
    maven { url 'https://code.redspace.io/releases' }
    maven { url 'https://code.redspace.io/snapshots' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "net.minecraftforge:forge:$minecraft_version-$forge_version"

    implementation fg.deobf("dev.shadowsoffire:Apotheosis:$minecraft_version-$apotheosis_version")
    implementation fg.deobf("dev.shadowsoffire:Placebo:$minecraft_version-$placebo_version")
    implementation fg.deobf("dev.shadowsoffire:ApothicAttributes:$minecraft_version-$attributeslib_version")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:$curios_version")

    // compat compile deps
    implementation fg.deobf("curse.maven:the-aether-255308:$aether_version")
    implementation fg.deobf("curse.maven:malum-484064:$malum_version")
    implementation fg.deobf("curse.maven:create-328085:$create_version")
    implementation fg.deobf("maven.modrinth:irons-artifice:$artifice_version")
    implementation fg.deobf("curse.maven:irons-spellbooks-855414:$spellbooks_version")
    // L2Hostility and dependencies
    implementation fg.deobf("curse.maven:l2library-620203:$l2library_version")
    // implementation fg.deobf('dev.xkmc.l2serial:l2serial:1.2.2')
    implementation fg.deobf('curse.maven:l2complements-758349:7606338')
    // implementation fg.deobf('dev.xkmc.l2tabs:l2tabs:0.3.3')
    implementation fg.deobf('curse.maven:l2hostility-909207:7815389')

    // Dev Env Mods
    implementation fg.deobf('curse.maven:jei-238222:7391695')
    implementation fg.deobf("curse.maven:jade-324717:$jade_file_id")
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:$cloth_config_version")
    runtimeOnly fg.deobf('curse.maven:mmmmmmmmmmmm-225738:6608233')
    runtimeOnly fg.deobf('curse.maven:lendercataclysm-551586:6906993')

    // Libs
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:$curios_version:api")
    runtimeOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:$player_anim_version")
    runtimeOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:$caelus_version")
    runtimeOnly fg.deobf('curse.maven:patchouli-306770:6164575')
    runtimeOnly fg.deobf('curse.maven:selene-499980:6611244')
    runtimeOnly fg.deobf('curse.maven:lionfish-api-1001614:5922047')

    implementation fg.deobf("io.github.rtxyd:fallen-lib:$fallen_lib_version:core")
    implementation fg.deobf("io.github.rtxyd:fallen-lib:$fallen_lib_version:runtime")
    implementation fg.deobf('curse.maven:fallen-gems-affixes-1286177:7863848')

    // runtime helpers for local testing
    implementation fg.deobf("maven.modrinth:lodestonelib:$lodestone_version")
    runtimeOnly "maven.modrinth:ancient-reforging:$ancientreforging_version"
}

minecraft {
    mappings channel: 'parchment', version: "$parchment_mappings_version-$parchment_minecraft_version"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://$project.projectDir/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
